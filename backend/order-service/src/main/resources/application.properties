spring.application.name=order-service
server.port=8082

# SQL Server Database
spring.datasource.url=jdbc:sqlserver://localhost:58796;databaseName=order_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${SQLSERVER_PASSWORD:Password123!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Dia chi cac Microservices
services.product.url=http://localhost:8081
